name: Build Android APK

on:
  push:
    branches: [ main, master, codex/* ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sleep-log/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app assets
        run: npm run build:app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Sync assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node -e 'require("fs").writeFileSync("android/app/src/main/assets/capacitor.config.json", JSON.stringify({appId:"com.mianji.sleep",appName:"眠记",webDir:"dist"}, null, 2))'
          node -e 'require("fs").writeFileSync("android/app/src/main/assets/capacitor.plugins.json", JSON.stringify([{pkg:"@capacitor-community/sqlite",classpath:"com.getcapacitor.community.database.sqlite.CapacitorSQLitePlugin"}], null, 2))'
          touch android/app/src/main/assets/public/cordova.js
          touch android/app/src/main/assets/public/cordova_plugins.js

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_build.log

      - name: Publish error log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-error-log
          cp -f /tmp/gradle_build.log ./build_error.log || echo "log missing" > build_error.log
          git add -f build_error.log
          git commit -m "ci: capture build error log"
          git push -f origin ci-error-log

      - name: Locate and stage APK
        run: |
          mkdir -p ../dist-apk
          cp -v android/app/build/outputs/apk/debug/*.apk ../dist-apk/
          ls -la ../dist-apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianji-sleep-debug-apk
          path: dist-apk/*.apk
