name: Build Android APK

on:
  push:
    branches: [ main, master, codex/* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sleep-log/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app assets
        run: npm run build:app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Sync assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node -e 'require("fs").writeFileSync("android/app/src/main/assets/capacitor.config.json", JSON.stringify({appId:"com.mianji.sleep",appName:"眠记",webDir:"dist"}, null, 2))'
          node -e 'require("fs").writeFileSync("android/app/src/main/assets/capacitor.plugins.json", JSON.stringify([{pkg:"@capacitor-community/sqlite",classpath:"com.getcapacitor.community.database.sqlite.CapacitorSQLitePlugin"}], null, 2))'
          touch android/app/src/main/assets/public/cordova.js
          touch android/app/src/main/assets/public/cordova_plugins.js

      - name: Setup Android SDK licenses and platforms
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianji-sleep-debug-apk
          path: sleep-log/android/app/build/outputs/apk/debug/app-debug.apk
