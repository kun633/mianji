name: Build Android APK

on:
  push:
    branches: [ main, master, codex/* ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sleep-log/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --pool=forks

      - name: Build web bundle validation
        run: npm run build:web

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --workers=2

      - name: Build app assets
        run: npm run build:app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Sync assets to Android
        run: npx cap sync android

      - name: Setup Android SDK licenses and platforms
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Debug and Release APKs
        run: |
          cd android
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle_build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle_build.log

      - name: Locate and stage APK
        run: |
          mkdir -p ../dist-apk
          APP_VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "../dist-apk/眠记-mianji-v${APP_VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../dist-apk/眠记-mianji-v${APP_VERSION}-release.apk"
          ls -la ../dist-apk
          if [ -z "$(ls -A ../dist-apk)" ]; then
            echo "ERROR: No APK generated by Gradle build!"
            exit 1
          fi

      - name: Verify release APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/release-apk-verification.log
          grep -Fq "552380581e75ea5cb426e298fc8c7b86b170ef0c822f4349e0374750b881fcf2" /tmp/release-apk-verification.log
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/release-apk-badging.log
          if grep -q "application-debuggable" /tmp/release-apk-badging.log; then
            echo "ERROR: Release APK must not be debuggable"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianji-sleep-debug-apk
          path: dist-apk/*-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianji-sleep-release-apk
          path: dist-apk/*-release.apk
          if-no-files-found: error

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: 眠记 (Mianji) ${{ github.ref_name }}
          body_path: sleep-log/docs/releases/v1.0.9.md
          draft: false
          prerelease: false
